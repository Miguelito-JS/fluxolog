{% extends "base.html" %}

{% block titulo %}Editar tarefa — FluxoLog{% endblock %}

{% block conteudo %}
<section class="editar">
  <h2>Editar tarefa #{{ tarefa.id }}</h2>
  <form method="post" class="formulario-coluna">
    <label>Título
      <input name="titulo" value="{{ tarefa.titulo }}" maxlength="100" required>
    </label>
    <label>Descrição
      <textarea name="descricao" rows="4" maxlength="500">{{ tarefa.descricao }}</textarea>
    </label>
    <label>Status
      <select name="status">
        {% for valor, nome in nomes_status.items() %}
        <option value="{{ valor }}" {% if valor == tarefa.status %}selected{% endif %}>{{ nome }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Prioridade
      <select name="prioridade">
        {% for valor, nome in nomes_prioridade.items() %}
        <option value="{{ valor }}" {% if valor == tarefa.prioridade %}selected{% endif %}>{{ nome }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="acoes">
      <button type="submit">Salvar</button>
      <a href="{{ url_for('web.quadro') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
